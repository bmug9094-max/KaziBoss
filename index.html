<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="description" content="KaziBoss : deviens le boss de ton business. Simulation, leçons et outils financiers terrain." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KaziBoss" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- Aperçu lors d'un partage (WhatsApp, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KaziBoss · Deviens le boss de ton business" />
    <meta property="og:description" content="30 jours pour faire tourner ta boutique : simulation terrain, leçons express et outils financiers. Gratuit, même hors-ligne." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:locale" content="fr_FR" />
    <title>KaziBoss</title>
    <style>
      /* Écran d'ouverture : affiché tout de suite, avant même le chargement du JavaScript.
         Retiré par src/lib/splash.ts une fois l'application prête. */
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(circle at 50% 38%, #1e293b 0%, #0f172a 62%);
        color: #f8fafc; font-family: 'Plus Jakarta Sans Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity .38s ease, visibility .38s;
      }
      #splash.splash-hide { opacity: 0; visibility: hidden; }
      #splash svg { width: 124px; height: 124px; filter: drop-shadow(0 18px 40px rgba(245, 158, 11, .25)); }
      #splash .s-bg { transform-origin: 256px 256px; animation: s-pop .55s cubic-bezier(.2, .9, .3, 1.25) both; }
      #splash .s-crown { transform-origin: 256px 200px; animation: s-drop .6s .25s cubic-bezier(.2, .9, .3, 1.3) both; }
      #splash .s-k { transform-origin: 256px 356px; animation: s-k .45s .45s ease-out both; }
      #splash .s-line { stroke-dasharray: 220; stroke-dashoffset: 220; animation: s-draw .55s .7s ease-out forwards; }
      #splash .s-name { font-size: 30px; font-weight: 800; letter-spacing: -.5px; animation: s-up .45s .75s ease-out both; }
      #splash .s-name b { color: #f59e0b; }
      #splash .s-tag { margin-top: -10px; font-size: 14px; color: #94a3b8; animation: s-up .45s .9s ease-out both; }
      #splash .s-bar { width: 120px; height: 3px; border-radius: 3px; background: #1e293b; overflow: hidden; animation: s-up .3s 1s both; }
      #splash .s-bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #f59e0b, #10b981); animation: s-load 1.1s 1s ease-in-out infinite; }
      @keyframes s-pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes s-drop { from { transform: translateY(-90px) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes s-k { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes s-draw { to { stroke-dashoffset: 0; } }
      @keyframes s-up { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes s-load { from { transform: translateX(-110%); } to { transform: translateX(280%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { animation: none !important; transition: none !important; }
        #splash .s-line { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Chargement de KaziBoss">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E293B" /><stop offset="1" stop-color="#0F172A" /></linearGradient>
          <linearGradient id="sgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBBF24" /><stop offset="1" stop-color="#F59E0B" /></linearGradient>
        </defs>
        <rect class="s-bg" width="512" height="512" rx="112" fill="url(#sbg)" stroke="#334155" stroke-width="6" />
        <g class="s-crown">
          <path d="M136 206 L184 150 L226 196 L256 124 L286 196 L328 150 L376 206 L360 252 H152 Z" fill="url(#sgold)" />
          <circle cx="256" cy="124" r="14" fill="#FBBF24" /><circle cx="184" cy="150" r="11" fill="#FBBF24" /><circle cx="328" cy="150" r="11" fill="#FBBF24" />
        </g>
        <path class="s-k" d="M176 278 h52 v52 l58 -52 h70 l-80 70 84 86 h-72 l-60 -64 v64 h-52 z" fill="#F8FAFC" />
        <path class="s-line" d="M316 420 l40 -40 26 22 44 -56" fill="none" stroke="#10B981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="s-name">Kazi<b>Boss</b></div>
      <div class="s-tag">Deviens le boss de ton business</div>
      <div class="s-bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
